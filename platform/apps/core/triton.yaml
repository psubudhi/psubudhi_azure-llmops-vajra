apiVersion: apps/v1
kind: Deployment
metadata:
  name: vajra-triton
  namespace: inference
  labels:
    app.kubernetes.io/name: vajra-triton
    app.kubernetes.io/part-of: vajra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vajra-triton
  template:
    metadata:
      labels:
        app: vajra-triton
        app.kubernetes.io/name: vajra-triton
        app.kubernetes.io/part-of: vajra
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      terminationGracePeriodSeconds: 30
      containers:
        - name: triton
          image: ghcr.io/devanshkhandekar/vajra-triton:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
            - name: grpc
              containerPort: 8001
            - name: metrics
              containerPort: 8002
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "3"
              memory: 8Gi
          startupProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /v2/health/ready
              port: 8000
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: 8000
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata:
  name: vajra-triton
  namespace: inference
  labels:
    app.kubernetes.io/name: vajra-triton
    app.kubernetes.io/part-of: vajra
spec:
  type: ClusterIP
  selector:
    app: vajra-triton
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: grpc
      port: 8001
      targetPort: grpc
    - name: metrics
      port: 8002
      targetPort: metrics
