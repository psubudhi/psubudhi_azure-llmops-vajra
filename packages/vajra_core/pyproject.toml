[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vajra-core"
version = "0.1.0"
description = "Reusable Vajra domain logic independent of Streamlit and infrastructure."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pydantic>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
