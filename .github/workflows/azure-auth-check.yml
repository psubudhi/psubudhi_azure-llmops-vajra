name: Azure authentication check

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: poc

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login through OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate subscription and AKS
        uses: azure/cli@v2
        with:
          inlineScript: |
            set -euo pipefail

            az account show --output table

            az group show \
              --name "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --output table

            az aks show \
              --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
              --name "${{ vars.AKS_NAME }}" \
              --query '{
                name:name,
                state:provisioningState,
                powerState:powerState.code
              }' \
              --output table
